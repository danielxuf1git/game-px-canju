name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages classic and workflow
        continue-on-error: true
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -d '{"source":{"branch":"main","path":"/"}}' || true
          curl -sS -X PUT -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -d '{"source":{"branch":"main","path":"/"}}' || true
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -d '{"build_type":"workflow"}' || true
      - name: Build site
        run: |
          mkdir -p _site
          cp -a index.html _site/ || true
          test -f .nojekyll && cp -a .nojekyll _site/ || true
          test -d src && cp -a src _site/ || true
          test -d public && cp -a public _site/ || true
          mkdir -p _site/pools
          python3 - <<'PY'
          import base64, gzip, pathlib, traceback
          from collections import defaultdict
          def dec(t):
              return base64.b64decode("".join(t.split()))
          roots = [pathlib.Path("_site"), pathlib.Path(".")]
          FIX = {
            "official-pool.json.gz.b64.00": {582:"7",585:"0",4022:"5",4159:"P"},
            "official-pool.json.gz.b64.01": {2258:"3",4714:"7",5826:"9",5829:"Q"},
            "official-pool.json.gz.b64.02": {1865:"r",4233:"/",4470:"7",4581:"2",5013:"W",5782:"E",5785:"v"},
          }
          try:
              pd = pathlib.Path(".github/pool")
              parts = sorted(p for p in pd.iterdir() if p.is_file() and ".gz.b64." in p.name) if pd.exists() else []
              if parts:
                  chunks = []
                  for p in parts:
                      s = "".join(p.read_text().split())
                      fx = FIX.get(p.name, {})
                      L = list(s)
                      for i,c in fx.items():
                          if i < len(L):
                              L[i] = c
                      chunks.append("".join(L))
                  raw = gzip.decompress(dec("".join(chunks)))
                  for site in roots:
                      (site/"pools").mkdir(exist_ok=True)
                      (site/"pools"/"official-pool.json").write_bytes(raw)
                  print("pool", len(raw))
          except Exception:
              traceback.print_exc()
          src = pathlib.Path(".github/b64")
          if src.exists():
              for p in sorted(src.rglob("*.b64")):
                  if ".b64." in p.name:
                      continue
                  try:
                      rel = str(p.relative_to(src))[:-4]
                      data = dec(p.read_text())
                      for site in roots:
                          dest = site / rel
                          dest.parent.mkdir(parents=True, exist_ok=True)
                          dest.write_bytes(data)
                      print("wrote", rel, len(data))
                  except Exception as e:
                      print("skip", p, e)
              chunks = defaultdict(list)
              for p in src.rglob("*"):
                  if p.is_file() and ".b64." in p.name:
                      chunks[p.parent.relative_to(src) / p.name.rsplit(".b64.",1)[0]].append(p)
              for dest_rel, files in chunks.items():
                  try:
                      files = sorted(files)
                      data = dec("".join("".join(f.read_text().split()) for f in files))
                      for site in roots:
                          dest = site / dest_rel
                          dest.parent.mkdir(parents=True, exist_ok=True)
                          dest.write_bytes(data)
                      print("wrote", dest_rel, len(data))
                  except Exception as e:
                      print("skip", dest_rel, e)
          print("ok")
          PY
          test -f _site/index.html
          test -f _site/src/view/table.html
      - name: Commit assembled assets
        continue-on-error: true
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add pools public official-pool.json || true
          git diff --cached --quiet || git commit -m "Assemble decoded pool and tile assets"
          git push || true
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        continue-on-error: true
