name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -eu
          mkdir -p _site
          for f in index.html .nojekyll README.md official-pool.json; do
            [ -f "$f" ] && cp -a "$f" "_site/$f"
          done
          for d in src public pools; do
            [ -d "$d" ] && cp -a "$d" "_site/$d"
          done
          echo "site files:"
          find _site -type f | sort
      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
